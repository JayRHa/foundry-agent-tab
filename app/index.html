<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Foundry Agents</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Theme before first paint. Teams tells us the real theme a moment later.
  (function () {
    try {
      var t = new URLSearchParams(location.search).get("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<script src="https://res.cdn.office.net/teams-js/2.31.0/js/MicrosoftTeams.min.js"
        integrity="sha384-A2y7iMKbK0AQrgKq1YKcLB8XgtyowB2MPzC40KFfA58nQObf6xU3C5NE0cTcis0V"
        crossorigin="anonymous" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" data-open="false">
    <div class="sidebar__head">
      <div class="mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/>
        </svg>
      </div>
      <div>
        <div class="sidebar__title">Foundry Agents</div>
        <div class="sidebar__sub" id="projectName">connecting…</div>
      </div>
    </div>

    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="filter" type="search" placeholder="Search agents" aria-label="Search agents" autocomplete="off" />
    </div>

    <nav class="agents" id="agentList" aria-label="Agents">
      <div class="agents__label">Available</div>
      <div class="skeleton" style="padding:8px 10px">
        <span></span><span></span><span></span>
      </div>
    </nav>

    <div class="sidebar__foot">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking connection…</span>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show agents" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <div class="header__text">
        <div class="header__name" id="agentName">Foundry Agents</div>
        <div class="header__tools" id="agentTools"></div>
      </div>
      <button class="icon-btn" id="resetBtn" aria-label="Start a new conversation" title="New conversation" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
        </svg>
      </button>
    </header>

    <div class="messages" id="messages">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer">
      <div class="composer__inner">
        <label for="input" class="sr-only">Message the agent</label>
        <textarea id="input" rows="1" placeholder="Ask the agent…" disabled></textarea>
        <button class="send" id="sendBtn" aria-label="Send" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
      <div class="composer__hint">
        <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
        <span id="turnMeta"></span>
      </div>
    </div>

    <p class="sr-only" role="status" aria-live="polite" id="live"></p>
  </main>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
